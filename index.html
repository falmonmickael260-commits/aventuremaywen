<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🌟 L'Aventure de Maywen 🌟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sun:#FFC857;
  --sun2:#FF9F1C;
  --sky:#5AC8FA;
  --sky2:#3E8EDE;
  --pink:#FF6FA5;
  --purple:#8E5CF7;
  --mint:#38D9A9;
  --cream:#FFF7E8;
  --ink:#3A2E52;
  --glass: rgba(255,255,255,0.22);
  --glass-border: rgba(255,255,255,0.55);
  --shadow: 0 20px 60px rgba(60,30,90,0.35);
  --radius: 32px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#1b1440;
  font-family:'Fredoka', sans-serif; color:var(--ink);}
h1,h2,h3,.title-font{font-family:'Baloo 2', sans-serif;}
button{font-family:inherit; border:none; cursor:pointer; background:none;}
#app{position:fixed; inset:0; overflow:hidden;}

/* ---------- BACKGROUND ---------- */
.bg-sky{
  position:absolute; inset:0;
  background: radial-gradient(circle at 20% 15%, #6a4bd6 0%, transparent 45%),
              radial-gradient(circle at 85% 10%, #ff7fb6 0%, transparent 40%),
              radial-gradient(circle at 50% 100%, #2a1f5e 0%, #140f33 70%),
              linear-gradient(160deg, #3b2a7a 0%, #1c1444 60%, #100c2c 100%);
  transition: filter 1s ease;
}
.bg-sky.game-mode{
  background: radial-gradient(circle at 15% 10%, #ffe08a 0%, transparent 40%),
              radial-gradient(circle at 90% 20%, #7fd8ff 0%, transparent 42%),
              linear-gradient(165deg, #5AC8FA 0%, #7C6CF0 55%, #FF9AC4 100%);
}
canvas#particles{position:absolute; inset:0; pointer-events:none;}

.cloud{position:absolute; opacity:.85; filter:drop-shadow(0 8px 18px rgba(0,0,0,.08));}
.cloud svg{width:100%; height:100%; display:block;}

/* ---------- LOADER ---------- */
#loader{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; z-index:50; transition:opacity .9s ease, transform .9s ease;
  padding:24px;
}
#loader.hide{opacity:0; transform:scale(1.08); pointer-events:none;}
.loader-frame{
  position:relative; width:min(80vw, 380px); display:flex; align-items:center; justify-content:center;
}
.loader-img-wrap{
  position:relative; width:100%;
  filter: drop-shadow(0 18px 40px rgba(20,10,45,.5));
  animation: floaty 4.5s ease-in-out infinite, zoomSlow 12s ease-in-out infinite;
}
.loader-img-wrap img{width:100%; height:auto; display:block; object-fit:contain;}
.sparkle{position:absolute; border-radius:50%; background:#fff; pointer-events:none; opacity:0;
  box-shadow:0 0 8px 2px #fff8cf; animation: twinkle 2.4s ease-in-out infinite;}

.loader-title{text-align:center;}
.loader-title h1{
  margin:0; font-weight:800; font-size:clamp(28px,7vw,46px);
  background:linear-gradient(90deg,#FFE08A,#FF9AC4,#B39CFF,#8CE0FF);
  background-size:300% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
  animation: shimmer 4s linear infinite, riseIn 1.1s cubic-bezier(.2,1.4,.4,1) both;
  letter-spacing:.5px;
}
.loader-title .sub{
  color:#fff; opacity:.9; font-weight:600; font-size:clamp(14px,3.6vw,18px);
  animation: riseIn 1.1s .15s cubic-bezier(.2,1.4,.4,1) both;
}
.stars-row{font-size:20px; letter-spacing:6px; animation: riseIn 1.1s .3s cubic-bezier(.2,1.4,.4,1) both;}

#startBtn{
  margin-top:6px; padding:20px 46px; border-radius:100px; font-weight:700; font-size:clamp(18px,4.6vw,24px);
  color:#3A2E52; background:linear-gradient(135deg,#FFE08A,#FFC857 60%, #FF9F1C);
  box-shadow: 0 14px 0 #C97B00, 0 20px 40px rgba(255,159,28,.45);
  transform: translateY(0); transition: transform .12s ease, box-shadow .12s ease;
  animation: riseIn 1.1s .45s cubic-bezier(.2,1.4,.4,1) both, pulseBtn 2.4s ease-in-out 1.6s infinite;
  display:flex; align-items:center; gap:10px;
}
#startBtn:active{transform:translateY(10px); box-shadow:0 4px 0 #C97B00, 0 8px 18px rgba(255,159,28,.4);}

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes floaty{0%,100%{transform:translateY(0px);} 50%{transform:translateY(-10px);}}
@keyframes zoomSlow{0%,100%{filter:brightness(1);} 50%{filter:brightness(1.06);}}
@keyframes shimmer{to{background-position:300% center;}}
@keyframes riseIn{from{opacity:0; transform:translateY(22px);} to{opacity:1; transform:translateY(0);}}
@keyframes pulseBtn{0%,100%{transform:scale(1);} 50%{transform:scale(1.045);}}
@keyframes twinkle{0%,100%{opacity:0; transform:scale(.4);} 50%{opacity:1; transform:scale(1);}}

/* ---------- GAME SCREEN ---------- */
#game{position:absolute; inset:0; display:none; flex-direction:column; z-index:20; opacity:0; transition:opacity .6s ease;}
#game.show{display:flex; opacity:1;}

.topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 6px; gap:10px;}
.progress-wrap{flex:1; display:flex; align-items:center; gap:10px;}
.progress-track{flex:1; height:16px; background:rgba(255,255,255,.4); border-radius:20px; overflow:hidden;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.15);}
.progress-fill{height:100%; width:0%; border-radius:20px;
  background:linear-gradient(90deg,#FFE08A,#FF9AC4,#B39CFF); transition:width .6s cubic-bezier(.3,1,.5,1);}
.qcounter{
  min-width:54px; text-align:center; background:rgba(255,255,255,.55); border-radius:16px; padding:6px 10px;
  font-weight:700; color:var(--ink); font-size:14px; box-shadow:var(--shadow);
}
.iconbtn{
  width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.55); display:flex; align-items:center;
  justify-content:center; font-size:20px; box-shadow:0 6px 14px rgba(0,0,0,.15);
  transition:transform .15s ease;
}
.iconbtn:active{transform:scale(.9);}

.stars-strip{display:flex; justify-content:center; gap:6px; padding:4px 10px 2px; flex-wrap:wrap;}
.star-slot{font-size:15px; opacity:.35; transition:opacity .3s ease, transform .3s ease;}
.star-slot.filled{opacity:1; transform:scale(1.15);}

.question-area{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 16px 4px; position:relative;}
.bubble{
  max-width:480px; text-align:center; background:var(--glass); border:2px solid var(--glass-border);
  backdrop-filter:blur(10px); padding:14px 22px; border-radius:24px; box-shadow:var(--shadow);
  color:#fff; font-weight:700; font-size:clamp(16px,4vw,20px); margin-bottom:16px;
  animation: bubbleIn .5s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes bubbleIn{from{opacity:0; transform:translateY(-14px) scale(.9);} to{opacity:1; transform:translateY(0) scale(1);}}
.replay-btn{
  display:inline-flex; align-items:center; gap:6px; margin-top:8px; padding:6px 14px; border-radius:100px;
  background:rgba(255,255,255,.35); color:#fff; font-weight:700; font-size:13px;
}

.cards-grid{
  display:grid; gap:14px; width:100%; max-width:640px;
  grid-template-columns:repeat(2, 1fr);
}
.cards-grid.count3{grid-template-columns:repeat(3, 1fr); max-width:560px;}
.card{
  position:relative; border-radius:26px; overflow:hidden; aspect-ratio:1/1;
  background:rgba(255,255,255,.35); border:4px solid rgba(255,255,255,.7);
  box-shadow: 0 14px 30px rgba(30,15,60,.28);
  transform:scale(1); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, filter .3s ease;
}
.card:active{transform:scale(.95);}
.card img{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;}
.card .shapeholder{width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#fff;}
.card.correct-flash{animation: correctPulse .8s ease;}
.card.wrong-flash{animation: wrongShake .5s ease;}
.card.disabled{filter:grayscale(.5) brightness(.75); pointer-events:none;}
@keyframes correctPulse{
  0%{box-shadow:0 0 0 0 rgba(255,255,150,.9);}
  60%{box-shadow:0 0 0 26px rgba(255,255,150,0);}
  100%{box-shadow:0 0 0 0 rgba(255,255,150,0);}
}
@keyframes wrongShake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-8px) rotate(-2deg);}
  40%{transform:translateX(8px) rotate(2deg);}
  60%{transform:translateX(-6px) rotate(-1deg);}
  80%{transform:translateX(6px) rotate(1deg);}
}
.card.correct-pick{border-color:#FFE08A; box-shadow:0 0 0 8px rgba(255,224,138,.55), 0 20px 40px rgba(30,15,60,.35);}

.count-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:4px; width:80%; height:80%; padding:8%;}
.count-grid img{width:100%; height:100%; object-fit:contain;}

/* feedback overlay */
#feedbackLayer{position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden;}
.confetti{position:absolute; top:-20px; border-radius:3px; opacity:.95;}
.badge-pop{
  position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(.4); opacity:0;
  background:linear-gradient(135deg,#FFE08A,#FF9F1C); color:#5b3400; font-weight:800; font-family:'Baloo 2',sans-serif;
  padding:16px 30px; border-radius:24px; font-size:clamp(20px,6vw,30px); box-shadow:0 18px 40px rgba(0,0,0,.35);
  border:4px solid #fff;
}
.badge-pop.show{animation: badgeIn 1.3s cubic-bezier(.2,1.6,.4,1) forwards;}
@keyframes badgeIn{
  0%{opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(-8deg);}
  55%{opacity:1; transform:translate(-50%,-50%) scale(1.12) rotate(3deg);}
  75%{transform:translate(-50%,-50%) scale(.95) rotate(-1deg);}
  100%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0);}
}

/* ---------- FINAL SCREEN ---------- */
#final{position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column;
  z-index:40; text-align:center; padding:24px; gap:14px;}
#final.show{display:flex;}
.trophy{font-size:min(26vw,120px); animation: trophyBounce 1.6s cubic-bezier(.3,1.6,.4,1) both, floaty 3s ease-in-out 1.6s infinite;}
@keyframes trophyBounce{0%{transform:scale(0) rotate(-30deg); opacity:0;} 60%{transform:scale(1.25) rotate(8deg); opacity:1;} 100%{transform:scale(1) rotate(0);}}
#final h1{color:#fff; font-size:clamp(28px,8vw,48px); margin:0;
  text-shadow:0 6px 24px rgba(0,0,0,.35); animation: riseIn .8s .3s both;}
#final .stat{color:#fff; font-weight:700; font-size:clamp(16px,4.4vw,22px); animation: riseIn .8s .45s both;}
#final .again{
  margin-top:10px; padding:18px 40px; border-radius:100px; font-weight:700; font-size:clamp(16px,4vw,20px);
  color:#3A2E52; background:linear-gradient(135deg,#FFE08A,#FFC857 60%, #FF9F1C);
  box-shadow: 0 12px 0 #C97B00; animation: riseIn .8s .6s both;
}
.again:active{transform:translateY(8px); box-shadow:0 4px 0 #C97B00;}

/* ---------- PARENT AREA ---------- */
#parentDot{
  position:fixed; bottom:10px; right:10px; width:34px; height:34px; border-radius:50%;
  background:rgba(255,255,255,.18); z-index:80; opacity:.5;
}
#parentModal{
  position:fixed; inset:0; background:rgba(20,12,40,.72); backdrop-filter:blur(6px);
  z-index:100; display:none; align-items:center; justify-content:center; padding:20px;
}
#parentModal.show{display:flex;}
.parent-card{
  background:#fff; border-radius:28px; padding:26px 24px; width:min(92vw,380px); box-shadow:var(--shadow);
}
.parent-card h3{margin:0 0 14px; font-family:'Baloo 2',sans-serif; color:var(--ink);}
.parent-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px;}
.parent-row label{font-weight:600; font-size:14px; color:var(--ink);}
.parent-row input[type=range]{flex:1; margin-left:10px;}
.parent-btn{width:100%; padding:12px; border-radius:14px; font-weight:700; margin-top:6px; background:#F1EEFF; color:var(--purple);}
.parent-btn.danger{background:#FFE8E8; color:#D64545;}
.parent-close{position:absolute; top:14px; right:18px; font-size:20px; color:#999;}
.parent-card{position:relative;}

.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <div class="bg-sky" id="bgSky"></div>
  <canvas id="particles"></canvas>

  <!-- LOADER -->
  <div id="loader">
    <div class="loader-frame">
      <div class="loader-img-wrap">
        <img src="https://res.cloudinary.com/dkm8cbylh/image/upload/v1786709907/ChatGPT_Image_14_aou%CC%82t_2026_14_18_16_mwusac.png" alt="Aventure de Maywen">
      </div>
      <div id="sparkleHolder"></div>
    </div>
    <div class="loader-title">
      <h1>✨ L'AVENTURE DE MAYWEN ✨</h1>
      <div class="sub">Une grande aventure magique t'attend !</div>
      <div class="stars-row">⭐⭐⭐⭐⭐</div>
    </div>
    <button id="startBtn">🎮 COMMENCER L'AVENTURE</button>
  </div>

  <!-- GAME -->
  <div id="game">
    <div class="topbar">
      <button class="iconbtn" id="muteBtn">🔊</button>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="qcounter" id="qCounter">1 / 16</div>
    </div>
    <div class="stars-strip" id="starsStrip"></div>
    <div class="question-area">
      <div class="bubble" id="promptBubble">
        <div id="promptText">…</div>
        <button class="replay-btn" id="replayBtn">🔁 Réécouter</button>
      </div>
      <div class="cards-grid" id="cardsGrid"></div>
    </div>
  </div>

  <!-- FINAL -->
  <div id="final">
    <div class="trophy">🏆</div>
    <h1>BRAVO MAYWEN !</h1>
    <div class="stat" id="finalStat">⭐ 16 étoiles gagnées ⭐</div>
    <div class="stat" style="font-size:16px; opacity:.85;">Tu es une super championne !</div>
    <button class="again" id="againBtn">🔁 Rejouer l'aventure</button>
  </div>

  <div id="feedbackLayer"></div>

  <!-- PARENT -->
  <div id="parentDot"></div>
  <div id="parentModal">
    <div class="parent-card">
      <span class="parent-close" id="parentClose">✕</span>
      <h3>👨‍👩‍👧 Mode parent</h3>
      <div class="parent-row">
        <label>🔊 Volume musique</label>
        <input type="range" id="volMusic" min="0" max="100" value="35">
      </div>
      <div class="parent-row">
        <label>🎙️ Volume voix</label>
        <input type="range" id="volVoice" min="0" max="100" value="100">
      </div>
      <div class="parent-row">
        <label>Bonnes réponses</label>
        <span id="parentScore" style="font-weight:700;">0 / 16</span>
      </div>
      <button class="parent-btn" id="parentRestart">🔁 Recommencer l'aventure</button>
      <button class="parent-btn danger" id="parentCloseBtn">Fermer</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   L'AVENTURE DE MAYWEN — jeu éducatif audio-guidé pour enfant
   ============================================================ */

/* ---------- IMAGES (photographies libres de droits — Wikimedia Commons) ---------- */
const WM = f => 'https://commons.wikimedia.org/wiki/Special:FilePath/' + f;
const IMG = {
  labrador:  WM('Black_Labrador_Retriever_-_Male_IMG_3323.jpg'),
  golden:    WM('Golden-retriever-1.jpg'),
  husky:     WM('Husky_Siberiano.jpg'),
  shepherd:  WM('German_Shepherd_Dog_Alsatian_1.jpg'),
  cat:       WM('Domestic_Cat_Face_Shot.jpg'),
  cow:       WM('Cow_female_black_white.jpg'),
  horse:     WM('Brown_and_black_horse.JPG'),
  sheep:     WM('Sheep.jpg'),
  rabbit:    WM('European_Rabbit_in_Alpine_National_Park.jpg'),
  squirrel:  WM('Eastern_Grey_Squirrel.jpg'),
  apple:     WM('Red_Apple.jpg'),
  banana:    WM('Banana-Single.jpg'),
  strawberry:WM('Strawberries.jpg'),
  tree:      WM('Oak_tree_on_a_football_field.JPG'),
  flower:    WM('A_Sunflower.jpg'),
  sun:       WM('Sun-in-the-sky.jpg'),
  cloud:     WM('Clouds_in_Sky.jpg'),
  car:       WM('Red_Saloon_Car_on_the_road.jpg'),
  bike:      WM('Mountain_bike.JPG'),
  bus:       WM('Passenger_Bus.jpg'),
  moto:      WM('Motorcycle-1698615_1920.jpg'),
  leaf:      WM('Single_leaf.jpg')
};

/* ---------- QUESTIONS ---------- */
function opt(img,label,correct){ return {img,label,correct: !!correct}; }

const QUESTIONS = [
  { prompt:"Maywen, peux-tu me montrer où est Bouba ? C'est un Labrador tout noir !",
    special:true,
    options:[ opt(IMG.labrador,'Bouba',true), opt(IMG.golden,'',false), opt(IMG.husky,'',false), opt(IMG.shepherd,'',false) ] },

  { prompt:"Coucou Maywen ! Peux-tu me montrer le chat ?",
    options:[ opt(IMG.cat,'',true), opt(IMG.rabbit,'',false), opt(IMG.squirrel,'',false), opt(IMG.cow,'',false) ] },

  { prompt:"Quel animal fait MEUUUH ? Trouve-le !",
    options:[ opt(IMG.cow,'',true), opt(IMG.horse,'',false), opt(IMG.sheep,'',false), opt(IMG.cat,'',false) ] },

  { prompt:"Où est le lapin, Maywen ?",
    options:[ opt(IMG.rabbit,'',true), opt(IMG.squirrel,'',false), opt(IMG.cat,'',false), opt(IMG.golden,'',false) ] },

  { prompt:"Maywen, montre-moi la pomme !",
    options:[ opt(IMG.apple,'',true), opt(IMG.banana,'',false), opt(IMG.strawberry,'',false), opt(IMG.leaf,'',false) ] },

  { prompt:"Où est la banane ?",
    options:[ opt(IMG.banana,'',true), opt(IMG.apple,'',false), opt(IMG.strawberry,'',false), opt(IMG.leaf,'',false) ] },

  { prompt:"Quelle image montre une fraise ?",
    options:[ opt(IMG.strawberry,'',true), opt(IMG.apple,'',false), opt(IMG.banana,'',false), opt(IMG.leaf,'',false) ] },

  { prompt:"Où est l'arbre, Maywen ?",
    options:[ opt(IMG.tree,'',true), opt(IMG.flower,'',false), opt(IMG.cloud,'',false), opt(IMG.sun,'',false) ] },

  { prompt:"Montre-moi la fleur !",
    options:[ opt(IMG.flower,'',true), opt(IMG.tree,'',false), opt(IMG.leaf,'',false), opt(IMG.sun,'',false) ] },

  { prompt:"Où est le soleil ?",
    options:[ opt(IMG.sun,'',true), opt(IMG.cloud,'',false), opt(IMG.tree,'',false), opt(IMG.flower,'',false) ] },

  { prompt:"Maywen, montre-moi la voiture !",
    options:[ opt(IMG.car,'',true), opt(IMG.bike,'',false), opt(IMG.bus,'',false), opt(IMG.moto,'',false) ] },

  { prompt:"Où est le vélo ?",
    options:[ opt(IMG.bike,'',true), opt(IMG.car,'',false), opt(IMG.moto,'',false), opt(IMG.bus,'',false) ] },

  { prompt:"Maywen, montre-moi quelque chose de rouge !",
    options:[ opt(IMG.apple,'',true), opt(IMG.banana,'',false), opt(IMG.leaf,'',false), opt(IMG.cloud,'',false) ] },

  { prompt:"Quel animal fait OUAF OUAF ? Trouve le chien qui aboie !",
    options:[ opt(IMG.husky,'',true), opt(IMG.cat,'',false), opt(IMG.cow,'',false), opt(IMG.sheep,'',false) ] },

  { prompt:"Maywen, peux-tu me montrer le rond, le cercle ?",
    shapes:true,
    options:[
      {shape:'circle', color:'#FF6FA5', correct:true},
      {shape:'square', color:'#5AC8FA', correct:false},
      {shape:'triangle', color:'#FFC857', correct:false},
      {shape:'star', color:'#8E5CF7', correct:false}
    ] },

  { prompt:"Maywen, montre-moi le groupe où il y a TROIS pommes !",
    count:true,
    options:[
      {n:1, correct:false}, {n:3, correct:true}, {n:2, correct:false}, {n:4, correct:false}
    ] }
];

/* ---------- SPEECH PHRASES ---------- */
const SUCCESS_PHRASES = [
  "Bravo Maywen ! C'est la bonne réponse !",
  "Super Maywen !",
  "Génial !",
  "Bravo !",
  "Excellent !",
  "Tu as trouvé !",
  "Waouh Maywen !",
  "Quelle championne !"
];
const FAIL_PHRASES = [
  "Presque ! Essaie encore !",
  "Hmm, regarde bien les images. Tu peux réessayer !",
  "Ce n'est pas celle-ci. Cherche encore !",
  "Pas tout à fait, essaie une autre image !"
];
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ---------- STATE ---------- */
let state = {
  index:0,
  stars:0,
  muted:false,
  musicVol:0.35,
  voiceVol:1
};

/* ============================================================
   AUDIO ENGINE (Web Audio synth chimes + ambient pad + Web Speech)
   ============================================================ */
let actx = null;
let masterGain, musicGain, sfxGain;
let musicNodes = [];

function ensureAudio(){
  if(actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = actx.createGain(); masterGain.gain.value = 1; masterGain.connect(actx.destination);
  musicGain = actx.createGain(); musicGain.gain.value = state.musicVol; musicGain.connect(masterGain);
  sfxGain = actx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(masterGain);
  startAmbientMusic();
}

function startAmbientMusic(){
  const notes = [261.6, 329.6, 392.0, 523.3]; // gentle C major pad
  notes.forEach((freq, i)=>{
    const osc = actx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const g = actx.createGain();
    g.gain.value = 0;
    osc.connect(g); g.connect(musicGain);
    osc.start();
    // slow swell in
    g.gain.linearRampToValueAtTime(0.05 + i*0.01, actx.currentTime + 3 + i);
    // slow LFO on gain for a magical shimmer
    const lfo = actx.createOscillator();
    lfo.frequency.value = 0.08 + i*0.02;
    const lfoGain = actx.createGain();
    lfoGain.gain.value = 0.02;
    lfo.connect(lfoGain); lfoGain.connect(g.gain);
    lfo.start();
    musicNodes.push({osc, g, lfo});
  });
}

function toneChime(freqs, dur=0.18, gap=0.09, type='sine', vol=0.22){
  ensureAudio();
  let t = actx.currentTime + 0.02;
  freqs.forEach(f=>{
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type; osc.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    osc.connect(g); g.connect(sfxGain);
    osc.start(t); osc.stop(t+dur+0.02);
    t += gap;
  });
}
function playSuccessChime(){ toneChime([523.3,659.3,783.9,1046.5], 0.16, 0.09, 'triangle', 0.25); }
function playFailChime(){ toneChime([392.0,329.6], 0.22, 0.16, 'sine', 0.18); }
function playVictoryChime(){ toneChime([523.3,659.3,783.9,1046.5,1318.5,1568.0], 0.22, 0.11, 'triangle', 0.28); }
function playClick(){ toneChime([700], 0.06, 0, 'square', 0.08); }
function playStar(){ toneChime([880, 1174.7], 0.12, 0.06, 'triangle', 0.18); }

/* ---------- SPEECH (Web Speech API, French) ---------- */
let frenchVoice = null;
function loadVoices(){
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  frenchVoice = voices.find(v=>/fr/i.test(v.lang) && /female|femme|amelie|marie|audrey/i.test(v.name))
             || voices.find(v=>/fr/i.test(v.lang))
             || null;
}
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, cb){
  if(!window.speechSynthesis || state.muted){ if(cb) setTimeout(cb, 700); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR';
  if(frenchVoice) u.voice = frenchVoice;
  u.rate = 0.92;
  u.pitch = 1.25;
  u.volume = state.voiceVol;
  if(cb) u.onend = cb;
  speechSynthesis.speak(u);
}

/* ============================================================
   PARTICLES (canvas background sparkle field)
   ============================================================ */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let W,H, parts=[];
function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize); resize();
function initParticles(n){
  parts = [];
  for(let i=0;i<n;i++){
    parts.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*2.2+0.6,
      vy: Math.random()*0.25+0.05,
      vx: (Math.random()-0.5)*0.15,
      tw: Math.random()*Math.PI*2,
      hue: Math.random()>0.5 ? '255,224,138' : '255,255,255'
    });
  }
}
initParticles(70);
function animateParticles(){
  ctx.clearRect(0,0,W,H);
  parts.forEach(p=>{
    p.tw += 0.03;
    const alpha = 0.35 + Math.sin(p.tw)*0.35;
    ctx.beginPath();
    ctx.fillStyle = `rgba(${p.hue},${Math.max(0,alpha)})`;
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    p.y -= p.vy; p.x += p.vx;
    if(p.y < -10){ p.y = H+10; p.x = Math.random()*W; }
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

/* little sparkles around loader image */
const sparkleHolder = document.getElementById('sparkleHolder');
for(let i=0;i<10;i++){
  const s = document.createElement('div');
  s.className='sparkle';
  const angle = (i/10)*Math.PI*2;
  const rad = 46;
  s.style.left = (50+Math.cos(angle)*rad)+'%';
  s.style.top = (50+Math.sin(angle)*rad)+'%';
  s.style.width = s.style.height = (4+Math.random()*4)+'px';
  s.style.animationDelay = (Math.random()*2)+'s';
  sparkleHolder.appendChild(s);
}

/* ============================================================
   CONFETTI / BADGE
   ============================================================ */
const feedbackLayer = document.getElementById('feedbackLayer');
const confettiColors = ['#FF6FA5','#FFC857','#8E5CF7','#38D9A9','#5AC8FA','#FF9F1C'];
function burstConfetti(count=36){
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className='confetti';
    const size = 6+Math.random()*8;
    el.style.width = size+'px';
    el.style.height = (size*0.4)+'px';
    el.style.left = (45+Math.random()*10)+'%';
    el.style.top = '35%';
    el.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
    const dx = (Math.random()-0.5)*window.innerWidth*0.8;
    const rot = Math.random()*720-360;
    const dur = 1.4+Math.random()*1.1;
    el.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${dx}px, ${window.innerHeight*0.75}px) rotate(${rot}deg)`, opacity:0}
    ], {duration:dur*1000, easing:'cubic-bezier(.2,.8,.4,1)'});
    feedbackLayer.appendChild(el);
    setTimeout(()=>el.remove(), dur*1000+50);
  }
}
function showBadge(text){
  const b = document.createElement('div');
  b.className='badge-pop';
  b.textContent = text;
  feedbackLayer.appendChild(b);
  requestAnimationFrame(()=>b.classList.add('show'));
  setTimeout(()=>b.remove(), 1500);
}

/* ============================================================
   GAME LOGIC
   ============================================================ */
const bgSky = document.getElementById('bgSky');
const loader = document.getElementById('loader');
const gameEl = document.getElementById('game');
const finalEl = document.getElementById('final');
const cardsGrid = document.getElementById('cardsGrid');
const promptText = document.getElementById('promptText');
const progressFill = document.getElementById('progressFill');
const qCounter = document.getElementById('qCounter');
const starsStrip = document.getElementById('starsStrip');
const replayBtn = document.getElementById('replayBtn');
const muteBtn = document.getElementById('muteBtn');

function buildStarsStrip(){
  starsStrip.innerHTML='';
  QUESTIONS.forEach((_,i)=>{
    const s = document.createElement('span');
    s.className='star-slot';
    s.textContent='⭐';
    s.id = 'star-'+i;
    starsStrip.appendChild(s);
  });
}

function shapeSVG(shape,color){
  const common = `width="70%" height="70%" viewBox="0 0 100 100"`;
  if(shape==='circle') return `<svg ${common}><circle cx="50" cy="50" r="42" fill="${color}"/></svg>`;
  if(shape==='square') return `<svg ${common}><rect x="12" y="12" width="76" height="76" rx="14" fill="${color}"/></svg>`;
  if(shape==='triangle') return `<svg ${common}><polygon points="50,8 92,88 8,88" fill="${color}"/></svg>`;
  if(shape==='star') return `<svg ${common} viewBox="0 0 51 48"><path d="M25.5 0 L31.5 17.5 L50 18 L35 29 L40 47 L25.5 36 L11 47 L16 29 L1 18 L19.5 17.5 Z" fill="${color}"/></svg>`;
  return '';
}

function renderQuestion(){
  const q = QUESTIONS[state.index];
  qCounter.textContent = (state.index+1)+' / '+QUESTIONS.length;
  progressFill.style.width = (state.index/QUESTIONS.length*100)+'%';
  promptText.textContent = q.prompt;

  cardsGrid.className = 'cards-grid';
  if(q.options.length===3) cardsGrid.classList.add('count3');
  cardsGrid.innerHTML='';

  const shuffled = q.options.map((o,i)=>({...o, _i:i})).sort(()=>Math.random()-0.5);

  shuffled.forEach(o=>{
    const card = document.createElement('div');
    card.className='card';
    if(q.shapes){
      const holder = document.createElement('div');
      holder.className='shapeholder';
      holder.innerHTML = shapeSVG(o.shape, o.color);
      card.appendChild(holder);
    } else if(q.count){
      const holder = document.createElement('div');
      holder.className='shapeholder';
      const grid = document.createElement('div');
      grid.className='count-grid';
      for(let i=0;i<o.n;i++){
        const img = document.createElement('img');
        img.src = IMG.apple;
        grid.appendChild(img);
      }
      holder.appendChild(grid);
      card.appendChild(holder);
    } else {
      const img = document.createElement('img');
      img.src = o.img;
      img.alt = o.label||'';
      img.loading='lazy';
      card.appendChild(img);
    }
    card.addEventListener('click', ()=>handleAnswer(card, o, q));
    cardsGrid.appendChild(card);
  });

  speakQuestion(q);
}

function speakQuestion(q){
  speak(q.prompt);
}
replayBtn.addEventListener('click', ()=>{ playClick(); speakQuestion(QUESTIONS[state.index]); });

let locked = false;
function handleAnswer(card, o, q){
  if(locked) return;
  playClick();
  if(o.correct){
    locked = true;
    card.classList.add('correct-flash','correct-pick');
    Array.from(cardsGrid.children).forEach(c=>{ if(c!==card) c.classList.add('disabled'); });
    playSuccessChime();
    burstConfetti(30);
    const phrase = q.special ? "BRAVO MAYWEN ! Tu as trouvé Bouba !" : pick(SUCCESS_PHRASES);
    showBadge(q.special ? "🐕 BRAVO ! Tu as trouvé Bouba !" : "⭐ BRAVO ! ⭐");
    speak(phrase);
    gainStar();
    setTimeout(()=>{
      locked = false;
      nextQuestion();
    }, 1900);
  } else {
    card.classList.add('wrong-flash');
    card.classList.add('disabled');
    playFailChime();
    speak(pick(FAIL_PHRASES));
    setTimeout(()=>card.classList.remove('wrong-flash'), 500);
  }
}

function gainStar(){
  state.stars++;
  const el = document.getElementById('star-'+state.index);
  if(el){ el.classList.add('filled'); }
  playStar();
}

function nextQuestion(){
  state.index++;
  if(state.index >= QUESTIONS.length){
    showFinal();
  } else {
    renderQuestion();
  }
}

function showFinal(){
  progressFill.style.width='100%';
  gameEl.classList.remove('show');
  finalEl.classList.add('show');
  document.getElementById('finalStat').textContent = '⭐ '+state.stars+' étoiles gagnées ⭐';
  playVictoryChime();
  burstConfetti(70);
  setTimeout(()=>burstConfetti(50), 500);
  setTimeout(()=>burstConfetti(50), 1000);
  speak("BRAVO MAYWEN ! Tu as terminé toute l'aventure ! Tu es une super championne !");
}

/* ---------- START ---------- */
document.getElementById('startBtn').addEventListener('click', ()=>{
  ensureAudio();
  playClick();
  loader.classList.add('hide');
  bgSky.classList.add('game-mode');
  setTimeout(()=>{
    gameEl.classList.add('show');
    buildStarsStrip();
    renderQuestion();
  }, 500);
});

/* ---------- MUTE ---------- */
muteBtn.addEventListener('click', ()=>{
  state.muted = !state.muted;
  muteBtn.textContent = state.muted ? '🔇' : '🔊';
  if(musicGain) musicGain.gain.value = state.muted ? 0 : state.musicVol;
  if(sfxGain) sfxGain.gain.value = state.muted ? 0 : 0.5;
  if(state.muted && window.speechSynthesis) speechSynthesis.cancel();
});

/* ---------- AGAIN ---------- */
document.getElementById('againBtn').addEventListener('click', ()=>{
  playClick();
  state.index = 0; state.stars = 0;
  finalEl.classList.remove('show');
  gameEl.classList.add('show');
  buildStarsStrip();
  renderQuestion();
});

/* ---------- PARENT MODE (long press 1.6s on discreet dot) ---------- */
const parentDot = document.getElementById('parentDot');
const parentModal = document.getElementById('parentModal');
let pressTimer = null;
function openParent(){
  document.getElementById('parentScore').textContent = state.stars+' / '+QUESTIONS.length;
  parentModal.classList.add('show');
}
parentDot.addEventListener('pointerdown', ()=>{
  pressTimer = setTimeout(openParent, 1600);
});
['pointerup','pointerleave','pointercancel'].forEach(ev=>{
  parentDot.addEventListener(ev, ()=> clearTimeout(pressTimer));
});
document.getElementById('parentClose').addEventListener('click', ()=>parentModal.classList.remove('show'));
document.getElementById('parentCloseBtn').addEventListener('click', ()=>parentModal.classList.remove('show'));
document.getElementById('volMusic').addEventListener('input', e=>{
  state.musicVol = e.target.value/100;
  if(musicGain && !state.muted) musicGain.gain.value = state.musicVol;
});
document.getElementById('volVoice').addEventListener('input', e=>{
  state.voiceVol = e.target.value/100;
});
document.getElementById('parentRestart').addEventListener('click', ()=>{
  parentModal.classList.remove('show');
  state.index=0; state.stars=0;
  finalEl.classList.remove('show');
  gameEl.classList.add('show');
  buildStarsStrip();
  renderQuestion();
});

/* ---------- floating decorative clouds ---------- */
function makeCloud(top,left,scale,dur){
  const c = document.createElement('div');
  c.className='cloud';
  c.style.top=top; c.style.left=left; c.style.width=(120*scale)+'px'; c.style.height=(70*scale)+'px';
  c.innerHTML = `<svg viewBox="0 0 120 70"><ellipse cx="30" cy="45" rx="28" ry="20" fill="white"/><ellipse cx="60" cy="32" rx="34" ry="26" fill="white"/><ellipse cx="90" cy="46" rx="26" ry="18" fill="white"/></svg>`;
  c.style.animation = `floaty ${dur}s ease-in-out infinite`;
  document.getElementById('app').appendChild(c);
}
makeCloud('8%','5%',0.9,7);
makeCloud('14%','70%',1.2,9);
makeCloud('4%','40%',0.7,6);
